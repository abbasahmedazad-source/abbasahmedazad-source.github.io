<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sketchy Site</title>
    
    <!-- CSS Styles - Sketchy Black & White -->
    <style>
        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', cursive, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ----- MAIN CARD - SKETCHY STYLE ----- */
        .card {
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 0px;
            padding: 48px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 12px 12px 0px 0px #000000;
            text-align: center;
            transition: all 0.1s ease;
            position: relative;
        }

        /* Slightly tilted for sketchy feel */
        .card {
            transform: rotate(-0.5deg);
        }

        .card:hover {
            transform: rotate(0.5deg) translate(-2px, -2px);
            box-shadow: 16px 16px 0px 0px #000000;
        }

        /* ----- SKETCHY AVATAR ----- */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 48px;
            color: #000000;
            box-shadow: 6px 6px 0px 0px #000000;
            transition: all 0.1s ease;
            transform: rotate(2deg);
        }

        .avatar:hover {
            transform: rotate(-3deg) scale(1.02);
            box-shadow: 10px 10px 0px 0px #000000;
        }

        /* ----- TYPOGRAPHY ----- */
        h1 {
            color: #000000;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 4px;
            letter-spacing: -1px;
            text-transform: uppercase;
            text-decoration: underline;
            text-underline-offset: 8px;
            text-decoration-thickness: 3px;
        }

        .subtitle {
            color: #333333;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 2px dashed #000000;
            padding-bottom: 12px;
        }

        .bio {
            color: #222222;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 28px;
            font-weight: 400;
            border-left: 3px solid #000000;
            padding-left: 16px;
            text-align: left;
        }

        /* ----- COUNTER SECTION - SKETCHY ----- */
        .counter-section {
            background: #ffffff;
            border: 3px solid #000000;
            padding: 20px;
            margin-bottom: 28px;
            box-shadow: 4px 4px 0px 0px #000000;
            transform: rotate(0.5deg);
        }

        .counter-label {
            color: #000000;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
        }

        .counter-number {
            color: #000000;
            font-size: 56px;
            font-weight: 900;
            margin: 4px 0 8px;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            border: 2px solid #000000;
            padding: 4px 12px;
            display: inline-block;
            background: #ffffff;
        }

        /* ----- SKETCHY BUTTONS ----- */
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border: 3px solid #000000;
            border-radius: 0px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: #ffffff;
            color: #000000;
            box-shadow: 4px 4px 0px 0px #000000;
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
        }

        .btn:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px 0px 0px #000000;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px 0px #000000;
        }

        .btn-primary {
            background: #ffffff;
            color: #000000;
        }

        .btn-primary:hover {
            background: #000000;
            color: #ffffff;
        }

        .btn-secondary {
            background: #ffffff;
            color: #000000;
            box-shadow: 4px 4px 0px 0px #555555;
        }

        .btn-secondary:hover {
            background: #eeeeee;
            box-shadow: 8px 8px 0px 0px #333333;
        }

        .btn-danger {
            background: #ffffff;
            color: #000000;
            border-color: #000000;
            box-shadow: 4px 4px 0px 0px #000000;
        }

        .btn-danger:hover {
            background: #000000;
            color: #ffffff;
        }

        /* ----- MESSAGE AREA ----- */
        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border: 3px solid #000000;
            font-size: 14px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            background: #ffffff;
            color: #000000;
            font-weight: 600;
            box-shadow: 4px 4px 0px 0px #000000;
            transform: rotate(-0.3deg);
        }

        .message-hidden {
            opacity: 0;
            transform: translateY(10px) rotate(0deg);
            pointer-events: none;
            box-shadow: none;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 480px) {
            .card {
                padding: 32px 20px;
                box-shadow: 8px 8px 0px 0px #000000;
            }
            .avatar {
                width: 90px;
                height: 90px;
                font-size: 36px;
            }
            h1 {
                font-size: 24px;
            }
            .counter-number {
                font-size: 40px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 13px;
                width: 100%;
            }
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        
        <!-- Avatar -->
        <div class="avatar">✏️</div>

        <!-- Title -->
        <h1>Sketchy Page</h1>
        <p class="subtitle">✦ Hand-drawn vibes ✦</p>

        <!-- Bio -->
        <p class="bio">
            Hello! 👋 This is a <strong>sketchy</strong> black & white test page.
            No colors — just pure black, white, and bold borders.
        </p>

        <!-- Counter -->
        <div class="counter-section">
            <div class="counter-label">Button Clicks</div>
            <div class="counter-number" id="clickCounter">0</div>
        </div>

        <!-- Buttons -->
        <div class="button-group">
            <button class="btn btn-primary" id="incrementBtn">+ Increment</button>
            <button class="btn btn-secondary" id="resetBtn">↺ Reset</button>
            <button class="btn btn-danger" id="decrementBtn">− Decrement</button>
        </div>

        <!-- Message Area -->
        <div class="message message-hidden" id="messageArea"></div>

    </div>

    <!-- JavaScript -->
    <script>
        // ----- DOM ELEMENTS -----
        const counterDisplay = document.getElementById('clickCounter');
        const incrementBtn = document.getElementById('incrementBtn');
        const decrementBtn = document.getElementById('decrementBtn');
        const resetBtn = document.getElementById('resetBtn');
        const messageArea = document.getElementById('messageArea');

        // ----- STATE -----
        let count = 0;

        // ----- HELPER FUNCTIONS -----
        function updateCounter() {
            counterDisplay.textContent = count;
        }

        function showMessage(text) {
            messageArea.textContent = text;
            messageArea.className = 'message';
            
            clearTimeout(window.messageTimeout);
            window.messageTimeout = setTimeout(() => {
                messageArea.className = 'message message-hidden';
            }, 3000);
        }

        // ----- EVENT HANDLERS -----
        function handleIncrement() {
            count += 1;
            updateCounter();
            showMessage(`✏️ Count is now ${count}`);
        }

        function handleDecrement() {
            count -= 1;
            updateCounter();
            showMessage(`⬇️ Count is now ${count}`);
        }

        function handleReset() {
            count = 0;
            updateCounter();
            showMessage(`↺ Counter reset to 0`);
        }

        // ----- ATTACH EVENTS -----
        incrementBtn.addEventListener('click', handleIncrement);
        decrementBtn.addEventListener('click', handleDecrement);
        resetBtn.addEventListener('click', handleReset);

        // ----- KEYBOARD SHORTCUTS -----
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === '+') {
                e.preventDefault();
                handleIncrement();
            } else if (e.key === 'ArrowDown' || e.key === '-') {
                e.preventDefault();
                handleDecrement();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                handleReset();
            }
        });

        // ----- WELCOME -----
        window.addEventListener('load', () => {
            showMessage('✏️ Sketchy mode activated!');
        });

        console.log('✏️ Sketchy black & white theme loaded!');
    </script>

</body>
</html>
